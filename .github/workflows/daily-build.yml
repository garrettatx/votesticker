# Daily rebuild and deploy (October 21, 2026). Some page text depends on the date: the home page's
# "Early voting is open today in N states", facts with an `until` date (Washington registration turns to
# past tense after October 26), and ribbons that change when a state's window closes. The static build
# freezes that text, so this rebuilds every morning at about 6 a.m. Central and on demand.
# The repo is public, so these runs don't count against the account's Actions minutes.
#
# Secrets (repository settings, never in this file): CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID.
name: Daily build

on:
  schedule:
    - cron: '5 11 * * *'   # 11:05 UTC: 6:05 a.m. CDT through November 1, 5:05 a.m. CST after
    # Post-election switch (docs/election-lifecycle-plan-20261025.md): 06:30 UTC November 4, after the last
    # scheduled poll closing (Alaska's Aleutians, 8 p.m. HST = 06:00 UTC). Remove after the 2026 election.
    - cron: '30 6 4 11 *'
  workflow_dispatch:
    inputs:
      vote_today:
        description: 'Build as this date (YYYY-MM-DD), e.g. 2026-11-04 to publish the post-election pages by hand'
        required: false
        default: ''
      dry_run:
        description: 'Build and QA only: no deploy, IndexNow or commit (to test a date ahead, e.g. 2026-11-04)'
        type: boolean
        required: false
        default: false
      between:
        description: 'Build between-elections pages (VOTE_BETWEEN=1). To keep it on for the daily runs, set the repository variable VOTE_BETWEEN to 1'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # commit build/lastmod.json and build/indexnow-sent.json back

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Chicago
      # index.php vote_today(): the post-election run builds as November 4 by name, not by clock.
      VOTE_TODAY: ${{ github.event.inputs.vote_today || (github.event.schedule == '30 6 4 11 *' && '2026-11-04') || '' }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
      # Between elections (index.php vote_between()): off until the December 1 review turns it on.
      VOTE_BETWEEN: ${{ (github.event.inputs.between == 'true' && '1') || vars.VOTE_BETWEEN || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate facts
        run: python3 -I build/facts_text.py --check

      - name: Build
        run: |
          python3 -I build/facts_text.py
          python3 -I build/build_static.py

      - name: QA the build locally
        run: |
          python3 -m http.server 8792 -d dist >/dev/null 2>&1 &
          sleep 2
          python3 -I scripts/qa_seo.py --base http://127.0.0.1:8792/ --no-legacy
          python3 -I scripts/qa_es.py --base http://127.0.0.1:8792/
          python3 -I scripts/qa_facts.py --base http://127.0.0.1:8792/

      - name: Check the phase the pages were built for
        run: |
          # The phase index.php vote_phase() gives VOTE_TODAY (or today), and what the Texas page says.
          d="${VOTE_TODAY:-$(date +%F)}"
          if [ "$VOTE_BETWEEN" = "1" ] || [[ "$d" > "2026-11-03" ]]; then want=post; elif [[ "$d" > "2026-11-01" ]]; then want=eday; else want=pre; fi
          got=$(grep -o 'window.VOTE_PHASE = "[a-z]*"' dist/texas/index.html | grep -o '"[a-z]*"' | tr -d '"')
          echo "Built as $d: phase $got (expected $want)"
          [ "$got" = "$want" ]

      - name: Deploy to Cloudflare Pages
        if: env.DRY_RUN != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name votesticker --branch main --commit-dirty=true

      - name: QA live
        if: env.DRY_RUN != 'true'
        # Up to three tries, a minute apart: on Oct 30 two runs failed here on "Remote end closed connection"
        # from the runner while the same checks passed from a desk, and a failure here skips IndexNow and the
        # build records commit. A real content failure still fails all three tries.
        run: |
          sleep 10
          for try in 1 2 3; do
            python3 -I scripts/qa_seo.py --no-legacy \
              && python3 -I scripts/qa_es.py \
              && python3 -I scripts/qa_facts.py --base https://votesticker.org/ \
              && exit 0
            echo "QA live try $try failed"; [ "$try" -lt 3 ] && sleep 60
          done
          exit 1

      - name: Tell search engines what changed
        if: env.DRY_RUN != 'true'
        run: python3 -I scripts/indexnow.py

      - name: Commit build records
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "votesticker-daily"
          git config user.email "actions@users.noreply.github.com"
          git add build/lastmod.json build/indexnow-sent.json site/facts-states.php
          git diff --cached --quiet || git commit -m "Daily build $(date +%F)"
          git push
